name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# This main is not deployed from GitHub. The previous job went red when
# cloud credentials were missing, then would have run the App Runner script.
# Leave this workflow as a no-op so a push to main stays green.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy is disabled
        run: |
          echo "HomeFlow main is not deployed from this workflow."
          echo "No cloud deploy. No App Runner. No cloud credentials required."
